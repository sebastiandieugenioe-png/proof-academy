<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="OSC favicon">
  <!--
    Favicon SVG — aggressively simplified for 16px rendering.
    Thicker strokes, no gold accent (would be sub-pixel and blur the mark).
    Duplicate of /app/icon.svg served explicitly under /brand for downloads.
  -->
  <g stroke="#1E3A8A" stroke-width="2.5" stroke-linecap="round">
    <line x1="16" y1="12" x2="16" y2="7" />
    <line x1="20" y1="16" x2="25" y2="16" />
    <line x1="16" y1="20" x2="16" y2="25" />
    <line x1="12" y1="16" x2="7" y2="16" />
  </g>
  <g fill="#1E3A8A">
    <circle cx="16" cy="5" r="2.2" />
    <circle cx="27" cy="16" r="2.2" />
    <circle cx="16" cy="27" r="2.2" />
    <circle cx="5" cy="16" r="2.2" />
  </g>
  <circle cx="16" cy="16" r="4" fill="#1E3A8A" />
</svg>
