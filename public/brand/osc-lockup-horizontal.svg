<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" role="img" aria-label="Online Spirits Club">
  <!-- Horizontal lockup — symbol left, wordmark right. Baseline-aligned. -->
  <!-- Symbol -->
  <g>
    <g stroke="#1E3A8A" stroke-width="3" stroke-linecap="round">
      <line x1="32" y1="23" x2="32" y2="14" />
      <line x1="41" y1="32" x2="50" y2="32" />
      <line x1="32" y1="41" x2="32" y2="50" />
      <line x1="23" y1="32" x2="14" y2="32" />
    </g>
    <g fill="#1E3A8A">
      <circle cx="32" cy="10" r="4" />
      <circle cx="54" cy="32" r="4" />
      <circle cx="32" cy="54" r="4" />
      <circle cx="10" cy="32" r="4" />
    </g>
    <circle cx="32" cy="32" r="8" fill="#1E3A8A" />
    <circle cx="32" cy="32" r="2" fill="#C8A44D" />
  </g>
  <!-- Wordmark -->
  <text x="76" y="41" font-family="'Inter', -apple-system, 'Segoe UI', sans-serif" font-weight="600" font-size="22" fill="#0F172A" letter-spacing="-0.4">Online Spirits Club</text>
</svg>
