<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" role="img" aria-label="Online Spirits Club (white)">
  <!--
    White version — for placement on dark, navy or photographic backgrounds.
    Includes the gold accent so the brand feel is preserved.
  -->
  <g>
    <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
      <line x1="32" y1="23" x2="32" y2="14" />
      <line x1="41" y1="32" x2="50" y2="32" />
      <line x1="32" y1="41" x2="32" y2="50" />
      <line x1="23" y1="32" x2="14" y2="32" />
    </g>
    <g fill="#FFFFFF">
      <circle cx="32" cy="10" r="4" />
      <circle cx="54" cy="32" r="4" />
      <circle cx="32" cy="54" r="4" />
      <circle cx="10" cy="32" r="4" />
    </g>
    <circle cx="32" cy="32" r="8" fill="#FFFFFF" />
    <circle cx="32" cy="32" r="2" fill="#C8A44D" />
  </g>
  <text x="76" y="41"
        font-family="Manrope, 'Manrope Bold', 'Inter', -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="22" fill="#FFFFFF" letter-spacing="-0.5">Online Spirits Club</text>
</svg>
