<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Online Spirits Club logo">
  <!--
    Online Spirits Club — Knowledge Node System
    Central node = mastery. Four satellite nodes = learning paths.
    Flat vector. No gradients. Palette: Navy #1E3A8A + optional Gold accent #C8A44D.
    64x64 viewBox chosen so pixel math is clean; stroke widths tuned to survive 16px favicon scaling.
  -->

  <!-- Connectors first so the nodes sit on top (crisper edges) -->
  <g stroke="#1E3A8A" stroke-width="3" stroke-linecap="round">
    <line x1="32" y1="23" x2="32" y2="14" />   <!-- to N -->
    <line x1="41" y1="32" x2="50" y2="32" />   <!-- to E -->
    <line x1="32" y1="41" x2="32" y2="50" />   <!-- to S -->
    <line x1="23" y1="32" x2="14" y2="32" />   <!-- to W -->
  </g>

  <!-- Satellite nodes -->
  <g fill="#1E3A8A">
    <circle cx="32" cy="10" r="4" />
    <circle cx="54" cy="32" r="4" />
    <circle cx="32" cy="54" r="4" />
    <circle cx="10" cy="32" r="4" />
  </g>

  <!-- Central node (mastery) -->
  <circle cx="32" cy="32" r="8" fill="#1E3A8A" />

  <!-- Tiny gold accent dot at the core (invisible at 16px — that’s intentional) -->
  <circle cx="32" cy="32" r="2" fill="#C8A44D" />
</svg>
